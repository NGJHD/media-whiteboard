appId: com.mediawhiteboard.app
productName: Media Whiteboard
copyright: MIT

# Portable only. No NSIS, no MSI, no auto-updater, no registry writes. (CLAUDE.md §15)
directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

# LGPL redistribution requires the notices to travel with the binaries (§15).
extraFiles:
  - THIRD-PARTY-NOTICES.md
  - LICENSE.ffmpeg.txt
  - LICENSE

# ffmpeg.exe / ffprobe.exe land here in step 2. They must exist as real files on
# disk, so they are extraResources and asar must not swallow them.
extraResources:
  - from: resources/bin
    to: bin
    filter: ['**/*']

asar: true
asarUnpack:
  - resources/bin/**

# One asset, named without spaces so it survives a URL. (CLAUDE.md §15)
artifactName: MediaWhiteboard-${version}-win-x64.${ext}

win:
  # 512x512 PNG in buildResources; electron-builder compiles it into the exe.
  icon: build/icon.png
  target:
    # `dir` is the portable folder §15 requires; `zip` is the deliverable §15
    # asks for, and is an archive of that same folder — not an installer.
    - target: dir
      arch: [x64]
    - target: zip
      arch: [x64]
  executableName: MediaWhiteboard
  # No code signing: this is an unsigned portable build by design.
  signAndEditExecutable: true

# electron-builder would otherwise try to rebuild native modules. There are none,
# and there must never be any. (CLAUDE.md §2)
npmRebuild: false
buildDependenciesFromSource: false
